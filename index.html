<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- 書体は後回しにする。
     ふつうに読み込むと、この1行が返ってくるまで画面が真っ白のまま止まる。
     日本語の書体は容量が大きいので、回線が細いとその待ち時間がそのまま体感になる。
     media="print" で読み込みだけ先に始め、届いたところで適用する。
     届くまでは端末の標準の書体で出て、そのあと Zen Kaku Gothic New に差し替わる。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      media="print" onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
</noscript>

<link rel="stylesheet" href="styles.css?v=cb83ac94">
</head>
<body>
<div id="root">
  <div class="kb-loading" style="padding:80px 0;color:#8A9099;font-size:13px;text-align:center;font-family:-apple-system,sans-serif;">
    読み込み中…
  </div>
</div>

<script src="vendor.js?v=cb83ac94"></script>
<script src="api.js?v=cb83ac94"></script>
<script src="app.js?v=cb83ac94"></script>

<script>
// 2回目以降は通信を待たずに開けるようにする。
// 使えない環境では何もせず、これまでどおり毎回読み込むだけになる。
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* 使えなくても支障はない */ });
  });
}
</script>
</body>
</html>
